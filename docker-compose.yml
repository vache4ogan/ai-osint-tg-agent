version: '3.8'

services:
  bot:
    build: .
    container_name: tg_osint_bot
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./cache.db:/app/cache.db

  ollama:
    image: ollama/ollama:latest
    container_name: tg_osint_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
